name: Bridge — tests locaux et preuves
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Installer les dépendances épinglées
        run: python scripts/bridge.py bootstrap --profile local-fast
      - name: Vérifier la syntaxe des scripts
        run: python -m compileall -q scripts tests
      - name: Diagnostic
        run: python scripts/bridge.py doctor --offline
      - name: Campagne locale obligatoire
        run: python scripts/bridge.py prove --profile local-fast
      - name: Arrêter uniquement ce projet
        if: always()
        run: python scripts/bridge.py down --profile local-fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: preuves-local-fast-${{ github.sha }}
          path: evidence/
          retention-days: 30
  integration-testnet:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Non exécuté — prérequis TELA et Sepolia absents ; ce job ne vaut pas validation.'
