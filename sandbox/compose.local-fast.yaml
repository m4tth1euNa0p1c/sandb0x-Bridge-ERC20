x-anvil: &anvil
  image: ${FOUNDRY_IMAGE:?locked image required}
  platform: linux/amd64
  entrypoint: [anvil]
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 1.0
  mem_limit: 384m
  restart: "no"
  stop_grace_period: 15s
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
  healthcheck:
    test: [CMD, cast, chain-id, --rpc-url, "http://127.0.0.1:8545"]
    interval: 3s
    timeout: 3s
    retries: 20
services:
  chain-a:
    <<: *anvil
    command: [--host, "0.0.0.0", --port, "8545", --chain-id, "31337", --hardfork, london, --timestamp, "1700000000", --block-time, "2", --threads, "2", --no-cors, --quiet, --state, /home/foundry/state.json, --state-interval, "10"]
    volumes: [chain_a_data:/home/foundry]
    networks: [chain_a]
  chain-b:
    <<: *anvil
    command: [--host, "0.0.0.0", --port, "8545", --chain-id, "31338", --hardfork, london, --timestamp, "1700000000", --block-time, "2", --threads, "2", --no-cors, --quiet, --state, /home/foundry/state.json, --state-interval, "10"]
    volumes: [chain_b_data:/home/foundry]
    networks: [chain_b]
