[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["vendor"]
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin/contracts/"]
solc_version = "0.8.30"
auto_detect_solc = false
evm_version = "london"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true
