Afficher commit, empreinte des sources, dernière campagne, environnement et liens de preuves. Calculer l'obsolescence après changement pertinent et afficher l'heure UTC. Séparer constat historique et service interrogé en direct.
Livrable : Instantané cohérent avec le registre et test d'obsolescence d'une preuve après modification.
Limite : Ne pas qualifier de direct une page statique ni faire passer une infrastructure saine pour un bridge fonctionnel.
