global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files: [bridge.rules.yml]

scrape_configs:
  - job_name: bridge
    metrics_path: /metrics
    body_size_limit: 1MB
    sample_limit: 256
    label_limit: 12
    label_value_length_limit: 128
    static_configs:
      - targets: [relayer:8080]
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
