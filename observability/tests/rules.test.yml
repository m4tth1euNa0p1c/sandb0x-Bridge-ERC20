          ]
        },
        {
          "eval_time": "20s",
          "alertname": "BridgeCollectionStale",
          "exp_alerts": [
            {
              "exp_labels": {
                "network": "a",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Collecte historique ancienne ou absente",
                "procedure": "observability/README.md#donnees-anciennes"
              }
            },
            {
              "exp_labels": {
                "network": "b",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Collecte historique ancienne ou absente",
                "procedure": "observability/README.md#donnees-anciennes"
              }
            }
          ]
        },
        {
          "eval_time": "35s",
          "alertname": "BridgeReconciliationUnknown",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Réconciliation inconnue, non concluante ou ancienne",
                "procedure": "observability/README.md#pause-et-reconciliation"
              }
            }
          ]
        }
      ],
      "promql_expr_test": [
        {
          "expr": "max(up{job=\"bridge\"}) or vector(0)",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "max(bridge:telemetry_fresh) or vector(0)",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "(bridge_code_info and on(job, instance) (bridge:telemetry_fresh == 1)) or (label_replace(vector(0),\"version\",\"Indisponible\",\"__name__\",\".*\") unless on() (bridge_code_info and on(job, instance) (bridge:telemetry_fresh == 1)))",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{version=\"Indisponible\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "(bridge_code_info{profile=~\"local-fast|local-besu\"} and on(job, instance) (bridge:telemetry_fresh == 1)) or (label_replace(vector(0),\"profile\",\"Indisponible\",\"__name__\",\".*\") unless on() (bridge_code_info{profile=~\"local-fast|local-besu\"} and on(job, instance) (bridge:telemetry_fresh == 1)))",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{profile=\"Indisponible\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "(bridge_network_info and on(job, instance) (bridge:telemetry_fresh == 1)) or (label_replace(label_replace(vector(0),\"network\",\"Indisponible\",\"__name__\",\".*\"),\"chain_id\",\"?\",\"__name__\",\".*\") unless on() (bridge_network_info and on(job, instance) (bridge:telemetry_fresh == 1)))",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{chain_id=\"?\",network=\"Indisponible\"}",
              "value": 0
            }
          ]
        },
        {
          "expr": "((bridge_reconciliation_state == 1) and on(job, instance) (bridge:telemetry_fresh == 1) and on(job, instance) (time() - bridge_reconciliation_updated_timestamp_seconds <= 60) and on(job, instance) (time() - bridge_reconciliation_updated_timestamp_seconds >= -5) and on(job, instance) (bridge_ready == 1)) or (label_replace(vector(0),\"state\",\"Indisponible\",\"__name__\",\".*\") unless on() ((bridge_reconciliation_state == 1) and on(job, instance) (bridge:telemetry_fresh == 1) and on(job, instance) (time() - bridge_reconciliation_updated_timestamp_seconds <= 60) and on(job, instance) (time() - bridge_reconciliation_updated_timestamp_seconds >= -5) and on(job, instance) (bridge_ready == 1)))",
          "eval_time": "20s",
          "exp_samples": [
            {
              "labels": "{state=\"Indisponible\"}",
              "value": 0
            }
          ]
        }
      ]
